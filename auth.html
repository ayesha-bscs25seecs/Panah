<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Panah — Continue with your mobile number." />
  <meta name="referrer" content="no-referrer" />
  <title>Panah — Continue</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-body">

  <div id="auth-app" role="main" aria-label="Panah login and signup">

    <header id="auth-header">
      <a href="index.html" class="back-link" aria-label="Back to chat">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      </a>
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#f5f3f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4" stroke="#f5f3f1" stroke-width="2"/>
        </svg>
      </div>
    </header>

    <main class="auth-card">
      <h1 class="auth-title">Continue to Panah</h1>
      <p class="auth-subtitle">Save your chats and pick up where you left off.</p>

      <!-- STUB NOTICE — remove once real Firebase phone auth is wired in -->
      <p class="auth-stub-note">Demo mode: OTP is not verified yet — Continue will proceed regardless of input.</p>

      <form id="auth-form" novalidate>
        <label class="auth-label" for="phone-input">Mobile number</label>
        <div class="phone-field">
          <span class="phone-prefix">+92</span>
          <input
            id="phone-input"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            placeholder="3XX XXXXXXX"
            maxlength="10"
            aria-label="Mobile number"
          />
        </div>

        <label class="auth-label" for="otp-input">OTP code</label>
        <input
          id="otp-input"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="6-digit code"
          aria-label="OTP code"
        />

        <!-- TODO: replace with Firebase phone auth (signInWithPhoneNumber +
             confirmationResult.confirm) before this redirect. This form
             currently performs NO validation — it always continues. -->
        <button id="continue-btn" type="submit" class="continue-btn">Continue</button>
      </form>

      <p class="auth-footnote">No password needed — just your number and a code, every time.</p>
    </main>

  </div>

  <script src="auth.js"></script>
</body>
</html>
