<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Panah, aapka mahfooz sahara. Financial rights guidance for Pakistani women." />
  <!-- Privacy: no referrer leakage -->
  <meta name="referrer" content="no-referrer" />
  <title>Panah, aapka mahfooz sahara</title>

  <!-- Inline SVG favicon (shield icon) — no external requests -->
  <link rel="icon" type="image/png" sizes="any" href="{{ url_for('static', filename='favicon.png') }}" />

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- ===== LAYOUT SHELL: sidebar (logged-in only) + app ===== -->
  <div id="layout">

    <!-- ===== SIDEBAR (hidden unless logged in) ===== -->
    <aside id="sidebar" aria-label="Chat history sidebar" hidden>
      <div class="sidebar-top">
        <button id="new-chat-btn" class="sidebar-btn" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span data-i18n="chat.newChat">Nayi guftagu</span>
        </button>
      </div>

      <!-- Chat history list — populated by script.js -->
      <nav class="sidebar-history" aria-label="Past chats">
        <p class="sidebar-section-label" data-i18n="chat.historyLabel">Pichli guftagu</p>
        <ul id="chat-history-list">
          <!-- <li class="history-item" data-chat-id="...">Title</li> injected here -->
        </ul>
      </nav>

      <!-- Settings + logout, pinned to bottom -->
      <div class="sidebar-bottom">
        <button id="settings-btn" class="sidebar-profile" type="button" aria-haspopup="dialog">
          <span class="profile-avatar" aria-hidden="true">
            <!-- Gear / cog icon -->
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </span>
          <span id="sidebar-profile-label" class="profile-label" data-i18n="chat.settings">Settings</span>
        </button>
        <button id="logout-btn" class="sidebar-btn sidebar-btn-ghost" type="button" data-i18n="chat.logout">Log out</button>
      </div>
    </aside>

    <!-- ===== APP SHELL ===== -->
    <div id="app" role="main" aria-label="Panah chat application">

      <!-- ===== HEADER BAR ===== -->
      <header id="chat-header" role="banner">
        <div class="header-left">
          <!-- Back to landing page -->
          <a href="{{ url_for('home') }}" class="header-back" aria-label="Home" title="Home">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </a>

          <!-- Sidebar menu toggle (mobile / logged-in only) -->
          <button
            id="sidebar-toggle-btn"
            class="header-btn"
            type="button"
            aria-label="Toggle chat history menu"
            title="Menu"
            hidden
          >
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>

          <!-- Panah logo -->
          <a href="{{ url_for('home') }}" class="header-logo-link" aria-label="Panah home">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Panah" class="header-logo-img" data-logo-default="{{ url_for('static', filename='logo.png') }}" data-logo-ur="{{ url_for('static', filename='logo-ur.png') }}" />
          </a>
          <div class="header-text">
            <h1 class="app-name" data-i18n="chat.appName">Panah</h1>
            <p class="subtitle" id="subtitle-text" data-i18n="chat.subtitle">aapka mahfooz sahara</p>
            <!-- Typing indicator shown in header while waiting for a reply -->
            <div class="typing-indicator-header" id="typing-indicator-header" aria-live="polite" aria-label="Bot is typing" hidden>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>

        <!-- Speaker toggle: mute / unmute bot voice replies -->
        <button
          id="speaker-toggle"
          class="header-btn speaker-btn"
          type="button"
          aria-label="Toggle voice replies"
          title="Toggle voice replies"
        >
          <!-- Speaker-on icon (default) -->
          <svg id="speaker-on-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <!-- Speaker-off icon (hidden by default) -->
          <svg id="speaker-off-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
          <span class="speaker-label" data-i18n="chat.speakerLabel">Awaz</span>
        </button>
      </header>

      <!-- ===== CHAT MESSAGES AREA ===== -->
      <div
        id="chat-area"
        role="log"
        aria-live="polite"
        aria-relevant="additions"
        aria-label="Chat messages"
      >
        <!-- Messages are injected here by script.js -->
      </div>

      <!-- ===== SUGGESTED QUESTION CHIPS ===== -->
      <div id="suggested-chips" class="suggested-chips" data-i18n-attr="aria-label:chat.suggestedTitle">
        <!-- Populated by script.js -->
      </div>

      <!-- ===== INPUT BAR ===== -->
      <footer id="input-bar" role="contentinfo">
        <div class="input-wrapper">
          <input
            id="message-input"
            type="text"
            autocomplete="off"
            maxlength="500"
            placeholder="Apna sawaal likhein ya bolein..."
            data-i18n-attr="placeholder:chat.placeholder|aria-label:chat.placeholder"
          />

          <!-- Microphone button for voice input (hidden if unsupported) -->
          <button
            id="mic-btn"
            class="input-btn"
            type="button"
            data-i18n-attr="aria-label:chat.micLabel|title:chat.micLabel"
          >
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
        </div>

        <!-- Send button -->
        <button
          id="send-btn"
          class="input-btn send-btn"
          type="button"
          data-i18n-attr="aria-label:chat.sendLabel|title:chat.sendLabel"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </footer>

    </div><!-- /#app -->

    <!-- Overlay for closing the sidebar drawer on mobile by tapping outside it -->
    <div id="sidebar-overlay" hidden></div>

    <!-- ===== SETTINGS PANEL (modal overlay) ===== -->
    <div id="settings-overlay" class="settings-overlay" hidden>
      <div id="settings-panel" class="settings-panel" role="dialog" aria-label="Settings" aria-modal="true">
        <div class="settings-header">
          <h2 class="settings-title" data-i18n="chat.settingsTitle">Settings</h2>
          <button id="settings-close-btn" class="settings-close-btn" type="button" aria-label="Close settings">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <div class="settings-body">
          <!-- Language preference -->
          <div class="settings-group">
            <label class="settings-label" data-i18n="chat.langPrefLabel">Language preference</label>
            <select id="settings-lang-select" class="settings-select">
              <option value="ur">اردو</option>
              <option value="en">English</option>
            </select>
          </div>

          <!-- Voice Output: the PERSISTENT, per-account preference.
               Saved under localStorage key "panah_volume_<phone>" and
               remembered across reloads and sessions. Logged-in users only
               (script.js un-hides it) — a guest has no account to store a
               preference for; guests keep the session-only top-right speaker
               button instead, which always starts ON each visit. -->
          <div class="settings-group" id="voice-output-group" hidden>
            <label class="settings-label" data-i18n="chat.voiceOutputLabel">Voice Output</label>
            <button
              id="settings-voice-toggle"
              class="settings-toggle"
              type="button"
              role="switch"
              aria-checked="true"
            >
              <span class="settings-toggle-track" aria-hidden="true">
                <span class="settings-toggle-knob"></span>
              </span>
              <span class="settings-toggle-state" id="settings-voice-state">On</span>
            </button>
            <p class="settings-hint" data-i18n="chat.voiceOutputHint">Remember this choice for your account.</p>
          </div>

          <!-- Clear chat history -->
          <div class="settings-group">
            <button id="settings-clear-history-btn" class="settings-danger-btn" type="button" data-i18n="chat.clearHistory">Clear all chat history</button>
          </div>

          <!-- Delete account: permanently removes the account itself (Firebase
               Auth record + ALL backend chat history). Logged-in users only —
               script.js un-hides this group, same as the Voice Output group.
               Destructive action (red styling) with a two-click confirmation
               flow: this button only opens the confirmation dialog below;
               confirming deletes immediately with no further input — the
               phone number/UID is taken from the current login session,
               never re-typed by the user. -->
          <div class="settings-group" id="delete-account-group" hidden>
            <button id="settings-delete-account-btn" class="settings-danger-btn" type="button" data-i18n="chat.deleteAccount">Delete Account</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== DELETE ACCOUNT CONFIRMATION DIALOG =====
         Click 2 of the flow. Opened on top of the still-open Settings
         overlay; Cancel returns to Settings. Confirming calls
         POST /delete-account with the session's Firebase ID token — on
         success script.js clears local state, signs out, and reloads this
         same page as a guest; on failure a localized inline error is shown
         and the user stays logged in. All strings are data-i18n driven so
         they follow the Settings language preference (Urdu/English). -->
    <div id="delete-account-overlay" class="settings-overlay delete-account-overlay" hidden>
      <div id="delete-account-dialog" class="settings-panel" role="alertdialog" aria-modal="true" aria-labelledby="delete-account-title" aria-describedby="delete-account-message">
        <div class="settings-header">
          <h2 class="settings-title" id="delete-account-title" data-i18n="chat.deleteAccountTitle">Delete account?</h2>
        </div>
        <div class="settings-body">
          <p id="delete-account-message" class="delete-account-message" data-i18n="chat.deleteAccountConfirm">Are you sure you want to delete your account? This will permanently delete your chat history and cannot be undone.</p>
          <!-- Shown only when deletion fails — the user stays logged in -->
          <p id="delete-account-error" class="delete-account-error" hidden data-i18n="chat.deleteAccountError">Sorry, we couldn't delete your account right now. Please try again.</p>
          <div class="delete-account-actions">
            <button id="delete-account-cancel-btn" class="settings-cancel-btn" type="button" data-i18n="chat.deleteAccountCancel">Cancel</button>
            <button id="delete-account-confirm-btn" class="settings-danger-btn" type="button" data-i18n="chat.deleteAccountConfirmBtn">Confirm Delete</button>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /#layout -->

  <!-- Application logic — vanilla JS, no build tools required -->
  <!-- Firebase SDKs — needed so script.js can call getIdToken() -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

  <script src="{{ url_for('static', filename='i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
