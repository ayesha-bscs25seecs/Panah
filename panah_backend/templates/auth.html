<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Panah, Continue with your mobile number." />
  <meta name="referrer" content="no-referrer" />
  <title>Panah, Continue</title>
  <link rel="icon" type="image/png" sizes="any" href="{{ url_for('static', filename='favicon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}" />

  <script src="{{ url_for('static', filename='i18n.js') }}"></script>

  <!-- Firebase SDKs — must load BEFORE auth.js -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
</head>
<body class="auth-body">

  <div id="auth-app" role="main" aria-label="Panah login and signup">

    <header id="auth-header">
      <!-- href is just the no-JS fallback (auth opened directly); auth.js
           turns this into a real "go back to the page you came from" click. -->
      <a href="{{ url_for('home') }}" class="back-link" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      </a>
      <div class="avatar" aria-hidden="true">
        <img src="{{ url_for('static', filename='logo-icon-transparent.png') }}" alt="" class="avatar-logo" />
      </div>
    </header>

    <main class="auth-card">
      <h1 class="auth-title" data-i18n="auth.title">Continue to Panah</h1>
      <p class="auth-subtitle" data-i18n="auth.subtitle">Save your chats and pick up where you left off.</p>

      <!-- Inline error message, hidden unless something goes wrong -->
      <p id="auth-error" class="auth-error-note" hidden data-i18n="auth.error">Something went wrong. Please try again.</p>

      <!-- STEP 1: phone number entry -->
      <form id="phone-form" novalidate>
        <label class="auth-label" for="phone-input" data-i18n="auth.phoneLabel">Mobile number</label>
        <div class="phone-field">
          <span class="phone-prefix">+92</span>
          <input
            id="phone-input"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            placeholder="3XX XXXXXXX"
            maxlength="10"
            data-i18n-attr="aria-label:auth.phoneLabel|placeholder:auth.phonePlaceholder"
          />
        </div>

        <!-- Invisible reCAPTCHA attaches here — stays empty/invisible, do not remove -->
        <div id="recaptcha-container"></div>

        <button id="send-code-btn" type="submit" class="continue-btn" data-i18n="auth.sendCode">Send code</button>
      </form>

      <!-- STEP 2: OTP entry — hidden until a code has been sent -->
      <form id="otp-form" novalidate hidden>
        <p class="auth-subtitle" id="otp-sent-to-note"></p>

        <label class="auth-label" for="otp-input" data-i18n="auth.otpLabel">OTP code</label>
        <input
          id="otp-input"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          data-i18n-attr="aria-label:auth.otpLabel|placeholder:auth.otpPlaceholder"
        />

        <button id="verify-code-btn" type="submit" class="continue-btn" data-i18n="auth.verify">Verify &amp; continue</button>
        <button id="change-number-btn" type="button" class="link-btn" data-i18n="auth.changeNumber">Use a different number</button>
      </form>

      <p class="auth-footnote" data-i18n="auth.footnote">No password needed, just your number and a code, every time.</p>
    </main>

  </div>

  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
