<!DOCTYPE html>
<html lang="ur" dir="ltr" class="landing-body">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Panah — contact our team." />
  <meta name="referrer" content="no-referrer" />
  <title>Panah — Contact</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="landing.css" />
</head>
<body class="landing-body">

  <header class="landing-header">
    <a href="homepage.html" aria-label="Panah home">
      <img src="logo-side.png" alt="Panah" class="landing-header-logo" />
    </a>
    <nav class="landing-nav" aria-label="Main navigation">
      <a href="homepage.html" data-i18n="nav.home">Home</a>
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="contact.html" class="active" data-i18n="nav.contact">Contact</a>
      <a href="privacy.html" data-i18n="nav.privacy">Privacy</a>
      <a href="index.html" class="landing-nav-chat" data-i18n="nav.chat">Chat</a>
    </nav>
  </header>

  <main class="content-page-main">
    <section class="content-hero">
      <h1 data-i18n="contact.title">Contact us</h1>
      <p data-i18n="contact.lead">Our team is ready to respond to your feedback, questions, or concerns.</p>
    </section>

    <section class="content-body">
      <form class="contact-form" onsubmit="event.preventDefault();">
        <div>
          <label for="contact-name" data-i18n="contact.formName">Your name</label>
          <input id="contact-name" type="text" autocomplete="name" />
        </div>
        <div>
          <label for="contact-message" data-i18n="contact.formMessage">Your message</label>
          <textarea id="contact-message"></textarea>
        </div>
        <button type="submit" data-i18n="contact.formSubmit">Send message</button>
      </form>

      <div class="contact-meta">
        <p><strong data-i18n="contact.emailLabel">Email:</strong> hello@panah.example</p>
        <p><strong data-i18n="contact.phoneLabel">Phone:</strong> <span data-i18n="contact.phone">+92-300-1234567</span></p>
      </div>

      <p data-i18n="contact.note">We try to reply within 24 to 48 hours.</p>
    </section>
  </main>

  <footer class="landing-footer">
    <div class="landing-footer-inner">
      <img src="logo-side.png" alt="Panah" class="landing-footer-logo" />
      <nav class="landing-footer-nav" aria-label="Footer navigation">
        <a href="homepage.html" data-i18n="nav.home">Home</a>
        <a href="about.html" data-i18n="nav.about">About</a>
        <a href="contact.html" data-i18n="nav.contact">Contact</a>
        <a href="privacy.html" data-i18n="nav.privacy">Privacy</a>
        <a href="index.html" data-i18n="nav.chat">Chat</a>
      </nav>
      <p class="landing-footer-copy" data-i18n="footer.tagline">Panah — your safe place to ask.</p>
    </div>
  </footer>

  <script src="i18n.js"></script>
</body>
</html>
