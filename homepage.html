<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Panah — Welcome back." />

  <link rel="stylesheet" href="style.css" />

<body class="auth-body">

  <div id="auth-app" role="main" aria-label="Panah homepage">

    <header id="auth-header">
      <a href="index.html" class="back-link" aria-label="Back to chat">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>

          <path d="M9 12l2 2 4-4" stroke="#f5f3f1" stroke-width="2"/>

    <main class="auth-card">
      <h1 class="auth-title">Welcome back 👋</h1>
      <p class="auth-subtitle">
        This is a placeholder — decide later what a logged-in user sees here
        (saved chat history, profile, etc.).
      </p>
      <a href="chat.html" class="continue-btn" style="display:inline-block; text-decoration:none; text-align:center;">
        Go to chat

  </div>
