<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Panah — aapka mahfooz sahara. Financial rights guidance for Pakistani women." />
  <!-- Privacy: no referrer leakage -->
  <meta name="referrer" content="no-referrer" />
  <title>Panah — aapka mahfooz sahara</title>

  <!-- Inline SVG favicon (shield icon) — no external requests -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== LAYOUT SHELL: sidebar (logged-in only) + app ===== -->
  <div id="layout">

    <!-- ===== SIDEBAR (hidden unless logged in) ===== -->
    <aside id="sidebar" aria-label="Chat history sidebar" hidden>
      <div class="sidebar-top">
        <button id="new-chat-btn" class="sidebar-btn" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>Nayi guftagu</span>
        </button>
      </div>

      <!-- Chat history list — populated by script.js -->
      <nav class="sidebar-history" aria-label="Past chats">
        <p class="sidebar-section-label">Pichli guftagu</p>
        <ul id="chat-history-list">
          <!-- <li class="history-item" data-chat-id="...">Title</li> injected here -->
        </ul>
      </nav>

      <!-- Profile / logout, pinned to bottom -->
      <div class="sidebar-bottom">
        <button id="sidebar-profile-btn" class="sidebar-profile" type="button" aria-haspopup="true">
          <span class="profile-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <span id="sidebar-profile-label" class="profile-label">Mera account</span>
        </button>
        <button id="logout-btn" class="sidebar-btn sidebar-btn-ghost" type="button">Log out</button>
      </div>
    </aside>

    <!-- ===== APP SHELL ===== -->
    <div id="app" role="main" aria-label="Panah chat application">

      <!-- ===== HEADER BAR ===== -->
      <header id="chat-header" role="banner">
        <div class="header-left">
          <!-- Back to landing page -->
          <a href="homepage.html" class="header-back" aria-label="Home" title="Home">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </a>

          <!-- Sidebar menu toggle (mobile / logged-in only) -->
          <button
            id="sidebar-toggle-btn"
            class="header-btn"
            type="button"
            aria-label="Toggle chat history menu"
            title="Menu"
            hidden
          >
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>

          <!-- Panah logo -->
          <a href="homepage.html" class="header-logo-link" aria-label="Panah home">
            <img src="logo.png" alt="Panah" class="header-logo-img" />
          </a>
          <div class="header-text">
            <h1 class="app-name">Panah</h1>
            <p class="subtitle" id="subtitle-text">aapka mahfooz sahara</p>
            <!-- Typing indicator shown in header while waiting for a reply -->
            <div class="typing-indicator-header" id="typing-indicator-header" aria-live="polite" aria-label="Bot is typing" hidden>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>

        <!-- Speaker toggle: mute / unmute bot voice replies -->
        <button
          id="speaker-toggle"
          class="header-btn speaker-btn"
          type="button"
          aria-label="Toggle voice replies"
          title="Toggle voice replies"
        >
          <!-- Speaker-on icon (default) -->
          <svg id="speaker-on-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <!-- Speaker-off icon (hidden by default) -->
          <svg id="speaker-off-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
          <span class="speaker-label">Awaz</span>
        </button>

        <!-- Continue / log in link — hidden once logged in (script.js) -->
        <a href="auth.html" id="continue-link" class="header-btn" aria-label="Continue / log in" title="Continue">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </a>
      </header>

      <!-- ===== CHAT MESSAGES AREA ===== -->
      <div
        id="chat-area"
        role="log"
        aria-live="polite"
        aria-relevant="additions"
        aria-label="Chat messages"
      >
        <!-- Messages are injected here by script.js -->
      </div>

      <!-- ===== SUGGESTED QUESTION CHIPS ===== -->
      <div id="suggested-chips" class="suggested-chips" aria-label="Suggested questions">
        <!-- Populated by script.js -->
      </div>

      <!-- ===== INPUT BAR ===== -->
      <footer id="input-bar" role="contentinfo">
        <div class="input-wrapper">
          <input
            id="message-input"
            type="text"
            autocomplete="off"
            maxlength="500"
            placeholder="Apna sawaal likhein ya bolein..."
            aria-label="Type your question"
          />

          <!-- Microphone button for voice input (hidden if unsupported) -->
          <button
            id="mic-btn"
            class="input-btn"
            type="button"
            aria-label="Speak your question"
            title="Speak your question"
          >
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
        </div>

        <!-- Send button -->
        <button
          id="send-btn"
          class="input-btn send-btn"
          type="button"
          aria-label="Send message"
          title="Send"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </footer>

    </div><!-- /#app -->

    <!-- Overlay for closing the sidebar drawer on mobile by tapping outside it -->
    <div id="sidebar-overlay" hidden></div>

  </div><!-- /#layout -->

  <!-- Application logic — vanilla JS, no build tools required -->
  <script src="script.js"></script>
</body>
</html>
